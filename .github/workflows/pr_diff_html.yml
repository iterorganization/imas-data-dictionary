name: Comment on Pull Request with XML diff link

on:
  workflow_run:
    workflows: [DD XML diffs]
    types: [completed]

permissions:
  pull-requests: write  # Required to comment on PRs
  issues: write         # Required for PR comments via issues API
  actions: read

jobs:
  comment:
    environment:
      name: azure
      deployment: false
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
    - name: 'Download html-diff and Fetch PR Number'
      id: pr_info
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const prs = await github.rest.repos.listPullRequestsAssociatedWithCommit({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.payload.workflow_run.head_sha,
          });
          
          if (!prs.data || prs.data.length === 0) {
            throw new Error("No open or closed pull request found associated with this commit SHA.");
          }
          
          const issue_number = prs.data[0].number;
          console.log(`Successfully resolved PR number: ${issue_number}`);
          
          core.setOutput('pr_number', issue_number);

          let allArtifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
          });
          
          let matchArtifact = allArtifacts.data.artifacts.find(
            (artifact) => artifact.name === "html-diff"
          );
          
          if (!matchArtifact) {
            throw new Error("No artifact found.");
          }
          
          
          let download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: matchArtifact.id,
              archive_format: 'zip',
          });
          
          const fs = require('fs');
          const path = require('path');
          const temp = '${{ runner.temp }}/artifacts';
          if (!fs.existsSync(temp)){
            fs.mkdirSync(temp);
          }
          fs.writeFileSync(path.join(temp, 'html-diff.zip'), Buffer.from(download.data));

    - name: 'Unzip artifact'
      run: unzip "${{ runner.temp }}/artifacts/html-diff.zip" -d "html-diff"
    - name: Upload to Azure
      uses: azure/cli@v2
      env:
        AZURE_STORAGE_ACCOUNT: ${{ secrets.ACCOUNT_NAME }}
        AZURE_STORAGE_KEY: ${{ secrets.ACCOUNT_KEY }}
      with:
        inlineScript: |
          az storage blob upload \
            --file "html-diff/index.html" \
            --container-name '$web' \
            --name "pr-${{ steps.pr_info.outputs.pr_number }}/index.html" \
            --content-type "text/html" \
            --auth-mode key
    - name: Check and wait for readthedocs (Max 10s)
      id: check-workflows
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const sha = context.payload.workflow_run.head_sha;
          console.log(`Checking workflow runs for SHA: ${sha}`);
          
          const maxWaitMs = 10000; // 10 seconds
          const intervalMs = 2000; // 2 seconds between checks
          let elapsedMs = 0;
           
          // Helper function to pause execution
          const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            
          while (elapsedMs <= maxWaitMs) {
            console.log(`\nFetching API... (Elapsed: ${elapsedMs/1000}s)`);
            
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
            });
              
            const runs = data.workflow_runs;
            const wf = runs.find(r => r.name === 'readthedocs/actions');
            
            if (wf) {
              if (wf.status === 'completed') {
                break;
              }
            }
              
            // If we haven't reached the max wait time, sleep and try again
            if (elapsedMs < maxWaitMs) {
              console.log(`Waiting ${intervalMs/1000} seconds...`);
              await sleep(intervalMs);
            }
              
            elapsedMs += intervalMs;
          }
            
          throw new Error("Timed out waiting for readthedocs/actions to complete.");
    - name: 'Update PR Description with Diff Link'
      uses: actions/github-script@v8
      env:
        PR_NUMBER: ${{ steps.pr_info.outputs.pr_number }}
        PREVIEW_URL: ${{secrets.PREVIEW_URL}}
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const pull_number = Number(process.env.PR_NUMBER);
          const previewUrl = process.env.PREVIEW_URL

          const pr = await github.rest.pulls.get({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pull_number,
          });

          let body = pr.data.body || '';

          const startMarker = '<!-- xml-diff imas-data-dictionary start -->';
          const endMarker = '<!-- xml-diff imas-data-dictionary end -->';
          const contentBlock = `${startMarker}\n----\n📚 XML Diff 📚: ${previewUrl}\n\n${endMarker}`;

          const regex = new RegExp(`${startMarker}[\\s\\S]*?${endMarker}`);
          
          if (regex.test(body)) {
            body = body.replace(regex, contentBlock);
            console.log("Existing XML Diff block found and updated.");
          } else {
            body = body ? `${body}\n\n${contentBlock}` : contentBlock;
            console.log("XML Diff block added to the end of the PR description.");
          }

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pull_number,
            body: body,
          });
